        notes: Day 1
        routeGpxFile: "Villach_to_Ljubljana_to_Zagreb.gpx"
      - livetrackUrl: "https://livetrack.garmin.com/session/37ddc630-f92c-8d38-9e31-88b9cba7e000/token/5D1ECDF5FD5FEB867A3689951D08DB5"
