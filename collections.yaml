# Follow My Garmin — trip collections
#
# Each collection groups one or more Garmin LiveTrack activities.
# Add a new collection for each stage/day/segment of your trip.
# Paste the Garmin LiveTrack URL once the session has been started.
# Leave livetrackUrl as null (or omit it) for planned or rest stages.

collections:
  - name: Day 1 — Departure
    activities:
      - livetrackUrl: "https://livetrack.garmin.com/session/75d067c2-fde9-88e2-b508-6a9b61245200/token/647A34545C325599622E92BE268B2F8"
        notes: Sample route used to populate the custom map.
      - livetrackUrl: null
        notes: Add a second Garmin session here if the day contains another activity.

  - name: Day 2 — Mountain pass
    activities:
      - livetrackUrl: null
        notes: Leave the activity URLs empty until those Garmin sessions exist.

  - name: Day 3 — Rest day
    activities: []
